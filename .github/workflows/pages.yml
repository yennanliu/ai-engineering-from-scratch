name: pages

# Publishes site/ to GitHub Pages using the same build Vercel runs
# (vercel.json's buildCommand), so both hosts serve identical content.

on:
  push:
    branches: [main]
    paths:
      - "phases/**" # lesson summaries + keywords feed data.js
      - "README.md"
      - "ROADMAP.md"
      - "glossary/**"
      - "site/**"
      - "vercel.json"
      - "scripts/pages_aliases.mjs"
      - "scripts/test_pages_aliases.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "vercel.json"
      - "scripts/pages_aliases.mjs"
      - "scripts/test_pages_aliases.mjs"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a running deploy — a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages has no rewrite engine, so vercel.json's clean URLs exist only as the
  # stubs pages_aliases.mjs writes. Nothing else checks them: a stub aimed at a
  # missing file publishes a 404 at a URL the whole site links to.
  validate:
    name: clean-URL aliases resolve
    runs-on: ubuntu-latest
    # Reads only; the workflow-level pages/id-token grants belong to deploy.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: every alias stub points at a file that ships
        run: node --test scripts/test_pages_aliases.mjs

  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Writes data.js, sitemap.xml, llms.txt and build-meta.js into site/.
      # build.js reads the deploy's git ref to decide which branch lesson.html
      # fetches docs/en.md from; VERCEL_GIT_COMMIT_REF is its documented input.
      - name: build site
        env:
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
        run: node site/build.js

      # Pages has no rewrite engine, so vercel.json's rewrites become
      # redirect stubs.
      - name: generate clean-URL aliases
        run: node scripts/pages_aliases.mjs

      # One-time manual setup, deliberately not automated: GITHUB_TOKEN cannot
      # create a Pages site (configure-pages' `enablement` input 404s), so set
      # Settings -> Pages -> Source to "GitHub Actions" once per repo. This
      # step fails with "Get Pages site failed / Not Found" until you do.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
